<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar de Chollos Diarios</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .container { max-width: 1080px; margin: 0 auto; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: 2rem; }
    .meta { color: #94a3b8; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }
    .card { background: #1e293b; border-radius: 14px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; }
    .thumb { width: 100%; height: 170px; object-fit: cover; background: #334155; }
    .body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .city { font-size: 1.3rem; font-weight: 800; margin: 0; }
    .country { color: #94a3b8; font-size: 0.85rem; margin: 2px 0 0; }
    .badge { background: #10b981; color: #052e16; font-weight: 700; padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; white-space: nowrap; }
    .price { font-size: 1.8rem; font-weight: 800; color: #38bdf8; margin: 14px 0 6px; }
    .sub { color: #cbd5e1; font-size: 0.85rem; margin: 3px 0; }
    .btn { margin-top: auto; padding: 10px; text-align: center; background: #38bdf8; color: #0f172a; font-weight: 700; text-decoration: none; border-radius: 8px; display: block; margin-top: 14px; }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✈️ Radar de Vuelos Baratos</h1>
      <div id="meta" class="meta">Cargando ofertas de hoy...</div>
    </header>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    fetch('./destinos_hoy.json?t=' + Date.now())
      .then(res => res.json())
      .then(data => {
        const fecha = new Date(data.actualizado_utc).toLocaleString('es-ES');
        document.getElementById('meta').textContent = `Salida desde ${data.origen} • Actualizado: ${fecha}`;

        document.getElementById('grid').innerHTML = data.destinos.map(d => `
          <div class="card">
            ${d.foto ? `<img class="thumb" src="${d.foto}" alt="${d.destino}" loading="lazy">` : ''}
            <div class="body">
              <div class="top">
                <div>
                  <h2 class="city">${d.destino}</h2>
                  <p class="country">${d.pais}</p>
                </div>
                <span class="badge">${d.puntuacion_chollo} pts</span>
              </div>
              <div class="price">${d.precio_vuelo_eur} €</div>
              <div class="sub">📅 ${d.fecha_salida} → ${d.fecha_regreso}</div>
              <div class="sub">🏨 Escapada 3 noches est.: <strong>${d.coste_escapada_3n_eur} €</strong></div>
              ${d.enlace ? `<a class="btn" href="${d.enlace}" target="_blank" rel="noopener">Ver vuelo en Google Flights</a>` : ''}
            </div>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('meta').textContent = 'No se encontró destinos_hoy.json. Comprueba que el workflow terminó en verde.';
      });
  </script>
</body>
</html>
